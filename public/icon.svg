<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner Plate Ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="8" />
  <circle cx="256" cy="256" r="148" fill="#ffffff" fill-opacity="0.08" />

  <!-- Central Symbol: Elegant Mess "M" merged with dining dome & scales -->
  <g filter="url(#dropShadow)">
    <!-- Cloche / Dome cover -->
    <path d="M168 288 C168 200, 344 200, 344 288 Z" fill="#ffffff" />
    <!-- Cloche Handle -->
    <circle cx="256" cy="188" r="18" fill="#ffffff" />
    <!-- Cloche Base Tray -->
    <rect x="144" y="288" width="224" height="18" rx="9" fill="#ffffff" />
    
    <!-- Bold Taka / Scale currency emblem badge -->
    <circle cx="340" cy="336" r="46" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="6" />
    <text x="340" y="352" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle">৳</text>
  </g>

  <!-- App Title Accent Lettering -->
  <text x="256" y="380" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="4" text-anchor="middle">MESS</text>
  <text x="256" y="416" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20" font-weight="600" fill="#a5b4fc" letter-spacing="6" text-anchor="middle">MANAGER</text>
</svg>
